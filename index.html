<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b3a8c"><link rel="icon" type="image/png" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body><title>Estimateur Auto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Estimation de prix d'achat maximum et de prix de vente conseillé pour une voiture d'occasion, à partir d'une plaque ou d'un VIN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concept : un dossier de véhicule en colonne unique. Bandeau de prix collant en haut (jaune « plaque arrière »),
   onglets en bas sur téléphone et en haut sur PC. Identité : plaque d'immatriculation (bleu européen + jaune). */
:root {
  --bg: #f2f5fa;
  --surface: #ffffff;
  --surface-2: #e8edf5;
  --ink: #0e1a2e;
  --muted: #566178;
  --line: #d3dae6;
  --accent: #1b3f9e;
  --accent-ink: #ffffff;
  --hl: #f4c20d;
  --hl-ink: #1b1500;
  --good: #17703f;
  --good-bg: #e1f3e8;
  --warn: #8a5300;
  --warn-bg: #fbefd5;
  --bad: #b3261e;
  --bad-bg: #fbe4e1;
  --plate-bg: #ffffff;
  --plate-ink: #0e1a2e;
  --plate-blue: #003399;
  --shadow: 0 1px 2px rgba(14, 26, 46, .08), 0 4px 14px rgba(14, 26, 46, .06);
  --font-display: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111e; --surface: #131b2d; --surface-2: #1b2640; --ink: #e8edf7; --muted: #9aa6bd; --line: #27334d;
    --accent: #7c9cff; --accent-ink: #08102a; --hl: #f4c20d; --hl-ink: #1b1500;
    --good: #55c98f; --good-bg: #12301f; --warn: #f0b04a; --warn-bg: #33260c; --bad: #ff8f86; --bad-bg: #3a1714;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111e; --surface: #131b2d; --surface-2: #1b2640; --ink: #e8edf7; --muted: #9aa6bd; --line: #27334d;
  --accent: #7c9cff; --accent-ink: #08102a; --hl: #f4c20d; --hl-ink: #1b1500;
  --good: #55c98f; --good-bg: #12301f; --warn: #f0b04a; --warn-bg: #33260c; --bad: #ff8f86; --bad-bg: #3a1714;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 980px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
h2 { font: 600 22px/1.15 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
h3 { font: 600 13px/1.3 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
small, .small { font-size: 13px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 10px; }
.brand { font: 700 20px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.plate { display: inline-flex; align-items: stretch; background: var(--plate-bg); color: var(--plate-ink); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1.5px var(--plate-ink), var(--shadow); font-family: var(--font-display); }
.plate .eu { background: var(--plate-blue); color: #fff; width: 24px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3px; font: 600 11px/1 var(--font-display); }
.plate .eu::before { content: "★"; font-size: 7px; color: #ffd84d; letter-spacing: 0; margin-bottom: 2px; }
.plate .pn { padding: 1px 12px 0; font-size: 26px; line-height: 1.35; font-weight: 600; letter-spacing: .07em; white-space: nowrap; }
.plate.empty .pn { opacity: .38; }
@media (max-width: 460px) { .plate .pn { font-size: 20px; padding: 1px 8px 0; } .plate .eu { width: 20px; } .brand { font-size: 17px; } }

/* Bandeau de prix collant */
.sum { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-bottom: 14px; }
.sum-btn { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 16px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 14px; cursor: pointer; }
.sum-btn .k { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sum-btn b { font: 600 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.yel { display: inline-block; background: var(--hl); color: var(--hl-ink); font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; padding: 4px 12px 2px; border-radius: 6px; letter-spacing: .02em; }
.sum-empty { font-size: 14px; }
.sum-empty b { font: 600 15px/1.3 var(--font-body); }
@media (max-width: 460px) { .sum-btn { grid-template-columns: auto 1fr; } .sum-btn .sum-r { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; } .sum-btn .sum-r .k { display: inline; } }

/* Onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(6px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(6px, env(safe-area-inset-left, 0px)); }
.tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; background: none; border: 0; border-radius: 8px; color: var(--muted); font: 500 11px/1.2 var(--font-body); cursor: pointer; }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tabs button[aria-current="page"] svg { stroke-width: 2.2; }
main { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
@media (min-width: 820px) {
  .tabs { position: static; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; padding: 4px; }
  .tabs button { flex-direction: row; justify-content: center; gap: 8px; font-size: 14px; padding: 10px 6px; }
  main { padding-bottom: 48px; }
}

/* Cartes et formulaires */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.f { display: grid; gap: 4px; min-width: 0; }
.f label, .lbl { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="number"], select, textarea { width: 100%; min-height: 44px; font: 400 16px/1.3 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
textarea { min-height: 120px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.row > .grow { flex: 1 1 200px; min-width: 0; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn.sec { background: transparent; color: var(--accent); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.hint { color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.note { border-radius: 8px; padding: 10px 12px; font-size: 14px; background: var(--surface-2); }
.note.good { background: var(--good-bg); color: var(--good); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }

/* Liens de recherche */
.links { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.links a { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); }
.links a b { color: var(--accent); }
.links a span { font-size: 12px; color: var(--muted); }

/* Annonces */
.comps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.comp { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.comp.off { opacity: .55; }
.comp .c-price { font: 600 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.comp .c-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.comp .c-norm { text-align: right; font-size: 13px; color: var(--muted); }
.comp .c-norm b { display: block; font: 600 16px/1.1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.comp .c-act { grid-column: 2 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.comp.st-aberrante { border-color: var(--warn); }
.comp.st-rejetée { border-color: var(--bad); }
.linkbtn { background: none; border: 0; padding: 4px 2px; color: var(--accent); font: 500 13px/1 var(--font-body); cursor: pointer; text-decoration: underline; }
.linkbtn.danger { color: var(--bad); }
details.card > summary { cursor: pointer; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { display: grid; gap: 2px; justify-items: center; align-content: center; text-align: center; min-height: 64px; padding: 8px 6px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px/1.15 var(--font-body); cursor: pointer; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button small { font-weight: 400; color: var(--muted); font-size: 11.5px; line-height: 1.2; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .85; }
.step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 13px/1 var(--font-body); margin-right: 8px; vertical-align: 3px; }
.cta { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 24; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cta-in { max-width: 980px; margin-inline: auto; display: grid; gap: 4px; }
.cta .btn { width: 100%; min-height: 52px; font-size: 17px; box-shadow: var(--shadow); }
.cta .st { text-align: center; font-size: 12.5px; color: var(--muted); }
.cta .st.ok { color: var(--good); font-weight: 600; }
@media (min-width: 820px) { .cta { bottom: 0; } }
.hero.sell .big .yel { font-size: 48px; }
.grid.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.share { display: flex; flex-wrap: wrap; gap: 8px; }
.share .btn { flex: 1 1 150px; }
.btn.lg { min-height: 52px; font-size: 16px; }
@media (max-width: 460px) {
  h2 { font-size: 20px; }
  .sum-btn { padding: 8px 12px; gap: 4px 12px; }
  .sum .yel { font-size: 24px; padding: 3px 9px 1px; }
  .sum-btn b { font-size: 18px; }
  .sum-btn .k { font-size: 10px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .stat { padding: 9px 10px; } .stat b { font-size: 22px; } .stat small { font-size: 12px; line-height: 1.3; }
  .hero .big .yel { font-size: 38px; }
}
@media (max-width: 460px) { body { font-size: 16px; } .card { padding: 14px; } .seg button { font-size: 13.5px; } }
details.tol { margin: 10px 0; border: 1px solid var(--line, rgba(128,128,128,.35)); border-radius: 10px; padding: 8px 12px; }
details.tol > summary { cursor: pointer; font-weight: 600; }
details.tol .grid { margin-top: 10px; }

/* Frais */
.reps { display: grid; gap: 6px; }
.rep { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); }
.rep.on { border-color: var(--accent); }
.rep-top { display: flex; gap: 10px; align-items: center; }
.rep-top label { flex: 1; min-width: 0; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; cursor: pointer; font-size: 14px; }
.rep-top .rng { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rep-more { display: none; gap: 10px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
.rep.on .rep-more { display: grid; }

/* Résultat */
.hero { display: grid; gap: 12px; }
.hero .big { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.hero .big .yel { font-size: 44px; padding: 6px 16px 3px; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 600 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); }
.meter { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--good); }
.meter.warn > i { background: var(--warn); } .meter.bad > i { background: var(--bad); }
.tblw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr.total td { font-weight: 700; border-bottom: 0; background: var(--surface-2); }
tr.total td:first-child { border-radius: 6px 0 0 6px; } tr.total td:last-child { border-radius: 0 6px 6px 0; }
.neg { color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-body); }
.verdict { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 420px); box-shadow: var(--shadow); }
@media (min-width: 820px) { .toast { bottom: 24px; } }
.dossier { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.dossier .t { font-weight: 600; overflow-wrap: anywhere; }
.dossier .a { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .btn, .sum-btn, .links a { transition: background-color .15s, border-color .15s; } }

/* ===== Refonte visuelle v2 ===== */
:root {
  --bg: #eef2f9; --surface: #ffffff; --surface-2: #e9eef8; --ink: #0c1730; --muted: #55627d; --line: #d8e0ee;
  --accent: #2342c7; --accent-2: #4d6bff; --accent-ink: #ffffff;
  --lu: #1f9d62; --essai: #8a96b3; --pz: #d9822b;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(12, 23, 48, .06), 0 10px 28px rgba(35, 66, 199, .08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #080e1d; --surface: #111a30; --surface-2: #19243f; --line: #243256; --accent: #8ba4ff; --accent-2: #6e8bff; --accent-ink: #091033; --lu: #4cd491; --essai: #7b88a8; --pz: #f0a24f; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.35); } }
:root[data-theme="dark"] { --bg: #080e1d; --surface: #111a30; --surface-2: #19243f; --line: #243256; --accent: #8ba4ff; --accent-2: #6e8bff; --accent-ink: #091033; --lu: #4cd491; --essai: #7b88a8; --pz: #f0a24f; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.35); }
body { background: radial-gradient(1200px 500px at 50% -120px, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), var(--bg); }
.top { padding-block: 6px 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 21px; }
.brand .logo { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.brand .logo svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.card { border-radius: var(--radius); border-color: transparent; box-shadow: var(--shadow); padding: 18px; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
h2 { font-size: 23px; }
.step { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 3px 8px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn { border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 28%, transparent); }
.btn.sec { background: transparent; box-shadow: none; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--accent); }
.btn.danger { background: transparent; box-shadow: none; }
input[type="text"], input[type="number"], select, textarea { border-radius: 12px; border: 1.5px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, var(--surface-2)); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.sum-btn { border-radius: 18px; border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow); }
.yel { border-radius: 10px; background: linear-gradient(180deg, #ffd43b, #f2b705); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }

<script>
/*!
 * Estimateur Auto — moteur de calcul
 * JS pur, sans dépendance, déterministe (la date "today" est injectable).
 * Principe de stabilité : aucune fonction publique ne lève d'exception vers l'appelant
 * (voir safeValuate) et toute donnée douteuse est rejetée avec une raison lisible.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.AutoEngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ */
  /* Utilitaires                                                         */
  /* ------------------------------------------------------------------ */
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function roundTo(x, step) { step = step || 1; return Math.round(x / step) * step; }
  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function median(a) {
    if (!a.length) return NaN;
    var s = a.slice().sort(function (x, y) { return x - y; });
    var m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function mad(a) {
    var m = median(a);
    return median(a.map(function (x) { return Math.abs(x - m); }));
  }
  function stripAccents(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  /** Nombre depuis une saisie française : "12 900 €", "85.000 km", "12900,5". NaN si illisible. */
  function toNumber(v) {
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    if (typeof v !== 'string') return NaN;
    var s = v.replace(/[\s  ]/g, '').replace(/[€$£]|euros?|eur|kms?/gi, '');
    if (!/^[-+]?[\d.,]+$/.test(s)) return NaN;
    var hasComma = s.indexOf(',') >= 0, hasDot = s.indexOf('.') >= 0;
    if (hasComma && hasDot) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (hasComma) {
      s = (s.split(',').length === 2 && /,\d{1,2}$/.test(s)) ? s.replace(',', '.') : s.replace(/,/g, '');
    } else if (hasDot) {
      s = /\.\d{3}$/.test(s) ? s.replace(/\./g, '') : s;
    }
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  function weightedQuantile(values, weights, q) {
    var n = values.length;
    if (!n) return NaN;
    if (n === 1) return values[0];
    var idx = [], i;
    for (i = 0; i < n; i++) idx.push(i);
    idx.sort(function (a, b) { return values[a] - values[b]; });
    var W = sum(weights), cum = 0, pos = [], vals = [];
    idx.forEach(function (k) {
      var w = weights[k];
      pos.push((cum + w / 2) / W);
      vals.push(values[k]);
      cum += w;
    });
    if (q <= pos[0]) return vals[0];
    if (q >= pos[n - 1]) return vals[n - 1];
    for (var k = 1; k < n; k++) {
      if (q <= pos[k]) {
        var t = (q - pos[k - 1]) / (pos[k] - pos[k - 1]);
        return vals[k - 1] + t * (vals[k] - vals[k - 1]);
      }
    }
    return vals[n - 1];
  }

  function ageYears(year, month, today) {
    year = toNumber(year);
    if (!isFinite(year)) return NaN;
    month = toNumber(month);
    if (!isFinite(month) || month < 1 || month > 12) month = 6;
    var t = today || new Date();
    return Math.max(0, (t.getFullYear() - year) + ((t.getMonth() + 1) - month) / 12);
  }

  /* ------------------------------------------------------------------ */
  /* Plaque d'immatriculation (France)                                   */
  /* ------------------------------------------------------------------ */
  function parsePlate(input) {
    var raw = String(input == null ? '' : input).toUpperCase().trim();
    var c = raw.replace(/[\s\-.]/g, '');
    var res = { valid: false, format: null, formatted: raw, errors: [], notes: [] };
    var m = /^([A-Z]{2})(\d{3})([A-Z]{2})$/.exec(c);
    if (m) {
      res.format = 'SIV';
      res.formatted = m[1] + '-' + m[2] + '-' + m[3];
      if (/[IOU]/.test(m[1] + m[3])) res.errors.push('Les lettres I, O et U ne sont jamais utilisées sur une plaque SIV.');
      if (m[1] === 'SS' || m[3] === 'SS') res.errors.push('La combinaison « SS » n\'est pas attribuée.');
      if (m[1] === 'WW') res.notes.push('Série WW : plaque provisoire (« W garage »), pas une immatriculation définitive.');
      res.valid = res.errors.length === 0;
      if (res.valid) res.notes.push('Format SIV (depuis 2009). La plaque seule ne donne ni l\'année ni les caractéristiques : voir le VIN sur la carte grise (case E).');
      return res;
    }
    m = /^(\d{1,4})([A-Z]{1,3})(\d{2}|2A|2B|9[78]\d)$/.exec(c);
    if (m) {
      res.format = 'FNI';
      res.formatted = m[1] + ' ' + m[2] + ' ' + m[3];
      res.valid = true;
      res.notes.push('Format FNI (avant 2009) : véhicule ancien ou plaque conservée. Département : ' + m[3] + '.');
      return res;
    }
    res.errors.push('Format de plaque non reconnu (attendu : AA-123-AA ou 1234 AB 75).');
    return res;
  }

  /* ------------------------------------------------------------------ */
  /* VIN                                                                 */
  /* ------------------------------------------------------------------ */
  var TRANSLIT = { A: 1, B: 2, C: 3, D: 4, E: 5, F: 6, G: 7, H: 8, J: 1, K: 2, L: 3, M: 4, N: 5, P: 7, R: 9, S: 2, T: 3, U: 4, V: 5, W: 6, X: 7, Y: 8, Z: 9 };
  var VIN_WEIGHTS = [8, 7, 6, 5, 4, 3, 2, 10, 0, 9, 8, 7, 6, 5, 4, 3, 2];
  var YEAR_CODES = 'ABCDEFGHJKLMNPRSTVWXY123456789';

  // Constructeurs courants (WMI = 3 premiers caractères). Table indicative, non exhaustive.
  var WMI = {
    VF1: 'Renault', VF3: 'Peugeot', VF7: 'Citroën', VR1: 'DS Automobiles', VNK: 'Toyota (France)',
    UU1: 'Dacia', WVW: 'Volkswagen', WVG: 'Volkswagen (SUV)', WV1: 'Volkswagen Utilitaires', WV2: 'Volkswagen (bus)',
    WAU: 'Audi', WUA: 'Audi Sport', WBA: 'BMW', WBS: 'BMW M', WBY: 'BMW i', WMW: 'MINI',
    WDB: 'Mercedes-Benz', WDC: 'Mercedes-Benz (SUV)', WDD: 'Mercedes-Benz', WME: 'smart',
    W0L: 'Opel', W0V: 'Opel', WP0: 'Porsche', WP1: 'Porsche (SUV)', WF0: 'Ford (Allemagne)',
    VSS: 'SEAT', ZFA: 'Fiat', ZFF: 'Ferrari', ZAR: 'Alfa Romeo', ZLA: 'Lancia', ZAM: 'Maserati', ZHW: 'Lamborghini',
    TMB: 'Škoda', TRU: 'Audi (Hongrie)', TMA: 'Hyundai (Tchéquie)',
    NM0: 'Ford (Turquie)', NMT: 'Toyota (Turquie)', NLH: 'Hyundai (Turquie)',
    SAJ: 'Jaguar', SAL: 'Land Rover', SCC: 'Lotus', SBM: 'McLaren', SCF: 'Aston Martin', SJN: 'Nissan (Royaume-Uni)', SB1: 'Toyota (Royaume-Uni)',
    YV1: 'Volvo', YV4: 'Volvo (SUV)', YS3: 'Saab',
    JHM: 'Honda', JTD: 'Toyota', JN1: 'Nissan', JMZ: 'Mazda', JS3: 'Suzuki', JF1: 'Subaru', JMB: 'Mitsubishi',
    KMH: 'Hyundai', KNA: 'Kia', KND: 'Kia (SUV)',
    '5YJ': 'Tesla (Fremont)', '7SA': 'Tesla (Fremont)', XP7: 'Tesla (Berlin)', LRW: 'Tesla (Shanghai)',
    '1FA': 'Ford (USA)', '1FT': 'Ford (utilitaires USA)', '1G1': 'Chevrolet', '1HG': 'Honda (USA)'
  };

  function vinCountry(vin) {
    var a = vin.charAt(0), two = vin.slice(0, 2);
    function r(lo, hi) { return two >= lo && two <= hi; }
    if (a === 'W') return 'Allemagne';
    if (r('VF', 'VR')) return 'France';
    if (r('VS', 'VW')) return 'Espagne';
    if (r('VA', 'VE')) return 'Autriche';
    if (a === 'Z' && two <= 'ZR') return 'Italie';
    if (r('SA', 'SM')) return 'Royaume-Uni';
    if (r('SU', 'SZ')) return 'Pologne';
    if (r('YA', 'YE')) return 'Belgique';
    if (r('YS', 'YW')) return 'Suède';
    if (r('XL', 'XR')) return 'Pays-Bas';
    if (r('TJ', 'TP')) return 'République tchèque';
    if (r('TR', 'TV')) return 'Hongrie';
    if (r('TA', 'TH')) return 'Suisse';
    if (r('UU', 'UZ')) return 'Roumanie';
    if (r('NL', 'NR')) return 'Turquie';
    if (a === 'J') return 'Japon';
    if (r('KL', 'KR')) return 'Corée du Sud';
    if (a === 'L') return 'Chine';
    if ('145'.indexOf(a) >= 0) return 'États-Unis';
    if (a === '2') return 'Canada';
    if (a === '3') return 'Mexique';
    return null;
  }

  function vinCheckDigit(vin) {
    var total = 0;
    for (var i = 0; i < 17; i++) {
      var ch = vin.charAt(i);
      var v = /\d/.test(ch) ? Number(ch) : TRANSLIT[ch];
      if (v === undefined) return null;
      total += v * VIN_WEIGHTS[i];
    }
    var r = total % 11;
    return r === 10 ? 'X' : String(r);
  }

  function parseVin(input, today) {
    var raw = String(input == null ? '' : input).toUpperCase().replace(/[\s\-.]/g, '');
    var res = { valid: false, vin: raw, errors: [], warnings: [], wmi: null, maker: null, country: null, modelYear: null, checkDigit: null };

      res.errors.push('Un VIN comporte exactement 17 caractères (reçu : ' + raw.length + ').');
      return res;
    }

      res.errors.push('Le VIN ne doit contenir que des lettres et des chiffres.');
      return res;
    }
    var bad = raw.match(/[IOQ]/g);
    if (bad) {
      res.errors.push('Les lettres I, O et Q n\'existent pas dans un VIN (probable confusion avec 1 ou 0) : ' + Array.from(new Set(bad)).join(', ') + '.');

    res.maker = WMI[res.wmi] || null;
    res.country = vinCountry(raw);
    res.vds = raw.slice(3, 9);
    res.vis = raw.slice(9);
    res.plantCode = raw.charAt(10);
    res.serial = raw.slice(11);
    if (!res.maker) res.warnings.push('Constructeur non présent dans la table intégrée : à confirmer via le décodage en ligne ou la carte grise.');

    var expected = vinCheckDigit(raw);
    var isNA = '12345'.indexOf(raw.charAt(0)) >= 0;
    res.checkDigit = { expected: expected, actual: raw.charAt(8), applicable: isNA, ok: expected === raw.charAt(8) };

      res.errors.push('Chiffre de contrôle invalide (obligatoire pour un VIN nord-américain) : VIN probablement mal saisi.');

    }

    var idx = YEAR_CODES.indexOf(raw.charAt(9));
    if (idx >= 0) {

      res.modelYear = { candidates: cands, likely: cands.length ? cands[cands.length - 1] : null, reliable: isNA };
      res.warnings.push('Année modèle déduite du 10ᵉ caractère : indicative' + (isNA ? '' : ' (convention non obligatoire en Europe)') + '. La date de 1ʳᵉ mise en circulation figure sur la carte grise.');
    }
    res.valid = true;
    return res;
  }

  /** Détecte automatiquement s'il s'agit d'un VIN ou d'une plaque. */
  function detectInput(str, today) {
    var compact = String(str == null ? '' : str).toUpperCase().replace(/[\s\-.]/g, '');
    if (!compact) return { type: 'empty', valid: false, errors: [] };
    if (/^[A-Z0-9]{17}$/.test(compact)) { var v = parseVin(compact, today); v.type = 'vin'; return v; }
    if (/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(compact) || /^\d{1,4}[A-Z]{1,3}(\d{2}|2A|2B|9[78]\d)$/.test(compact)) {

    }

  }

  /* ------------------------------------------------------------------ */
  /* Annonces comparables : analyse statistique                          */
  /* ------------------------------------------------------------------ */
  var DEFAULT_MARKET = {
    priorKm: -0.020,        // variation relative (log) pour +10 000 km
    priorYear: -0.065,      // variation relative (log) par année d'âge, à km égal
    proAdj: -0.05,          // annonce pro -> équivalent particulier (garantie incluse dans le prix pro)
    foreignWeight: 0.7,     // poids d'une annonce hors France
    outlierZ: 3,
    ridgeK: 6,              // force de l'a priori (en "observations")
    minComps: 3,
    conditionFactor: { excellent: 0.04, bon: 0, moyen: -0.05, mauvais: -0.12 }
  };

  function solve(A, r) {
    var n = r.length, i, j, k;
    var M = A.map(function (row, i2) { return row.slice().concat([r[i2]]); });
    for (i = 0; i < n; i++) {
      var p = i;
      for (j = i + 1; j < n; j++) if (Math.abs(M[j][i]) > Math.abs(M[p][i])) p = j;
      if (Math.abs(M[p][i]) < 1e-12) return null;
      var tmp = M[i]; M[i] = M[p]; M[p] = tmp;
      for (j = i + 1; j < n; j++) {
        var f = M[j][i] / M[i][i];
        for (k = i; k <= n; k++) M[j][k] -= f * M[i][k];
      }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) {
      var s = M[i][n];
      for (j = i + 1; j < n; j++) s -= M[i][j] * x[j];
      x[i] = s / M[i][i];
    }
    return x;
  }

  /** Régression log-linéaire pondérée avec a priori (ridge) sur les pentes km et âge. */
  function fitModel(pts, prior, k0) {
    var n = pts.length;
    var fallback = { b: prior.b, c: prior.c, source: 'défaut' };
    if (n < 4) return fallback;
    var wsum = sum(pts.map(function (p) { return p.w; }));
    if (!(wsum > 0)) return fallback;
    var nf = n / wsum;
    var P = pts.map(function (p) { return { y: p.y, x: [p.x1, p.x2], w: p.w * nf }; });
    var mean = [0, 0], vr = [0, 0], j;
    for (j = 0; j < 2; j++) {
      mean[j] = sum(P.map(function (p) { return p.w * p.x[j]; })) / n;
      vr[j] = sum(P.map(function (p) { return p.w * Math.pow(p.x[j] - mean[j], 2); })) / n;
    }
    var active = [vr[0] > 1e-4, vr[1] > 1e-4];
    if (!active[0] && !active[1]) return fallback;
    var beta = [prior.b, prior.c];
    var cols = [];
    for (j = 0; j < 2; j++) if (active[j]) cols.push(j);
    var m = 1 + cols.length;
    var A = [], r = [], a, b;
    for (a = 0; a < m; a++) { A.push(new Array(m).fill(0)); r.push(0); }
    P.forEach(function (p) {
      var yAdj = p.y;
      for (var jj = 0; jj < 2; jj++) if (!active[jj]) yAdj -= beta[jj] * p.x[jj];
      var row = [1];
      cols.forEach(function (cj) { row.push(p.x[cj]); });
      for (a = 0; a < m; a++) {
        r[a] += p.w * row[a] * yAdj;
        for (b = 0; b < m; b++) A[a][b] += p.w * row[a] * row[b];
      }
    });
    cols.forEach(function (cj, ci) {
      var lam = k0 * vr[cj];
      A[ci + 1][ci + 1] += lam;
      r[ci + 1] += lam * beta[cj];
    });
    var sol = solve(A, r);
    if (!sol) return fallback;
    cols.forEach(function (cj, ci) { beta[cj] = sol[ci + 1]; });
    return {
      b: clamp(beta[0], -0.045, -0.004),
      c: clamp(beta[1], -0.14, -0.015),
      source: 'régression + a priori'
    };
  }

  function sourceKey(s) { return stripAccents(String(s || '').toLowerCase()).replace(/[^a-z0-9.]/g, ''); }

  /**
   * target : {year, month?, km}
   * comps  : [{price, km, year, month?, source?, country?, seller?, url?, note?, include?}]
   */
  function analyzeComparables(target, comps, optsIn) {
    var opts = Object.assign({}, DEFAULT_MARKET, optsIn || {});
    var today = opts.today || new Date();
    var warnings = [];
    var tAge = ageYears(target && target.year, target && target.month, today);
    var tKm = toNumber(target && target.km);
    if (!isFinite(tAge) || !isFinite(tKm) || tKm < 0) {
      return { ok: false, error: 'Renseignez l\'année de 1ʳᵉ mise en circulation et le kilométrage du véhicule.' };
    }
    var rows = (Array.isArray(comps) ? comps : []).map(function (c, i) {
      return { index: i, input: c || {}, status: 'ok', reason: '' };
    });
    var seen = {}, cy = today.getFullYear();

    rows.forEach(function (r) {
      var c = r.input;
      r.price = toNumber(c.price); r.km = toNumber(c.km);
      r.year = toNumber(c.year); r.month = toNumber(c.month);
      r.source = String(c.source || '').trim(); r.country = String(c.country || 'FR').trim().toUpperCase() || 'FR';
      r.seller = c.seller === 'pro' ? 'pro' : (c.seller === 'part' ? 'part' : '');
      if (c.include === false) { r.status = 'manuel'; r.reason = 'Exclue par vous'; return; }
      var bad = null;
      if (!isFinite(r.price) || r.price < 200 || r.price > 1500000) bad = 'Prix invalide';
      else if (!isFinite(r.km) || r.km < 0 || r.km > 1000000) bad = 'Kilométrage invalide ou manquant';
      else if (!isFinite(r.year) || r.year < 1950 || r.year > cy + 1) bad = 'Année invalide ou manquante';
      if (bad) { r.status = 'rejetée'; r.reason = bad; return; }
      r.age = ageYears(r.year, r.month, today);
      var key = [Math.round(r.price), Math.round(r.km), r.year, isFinite(r.month) ? r.month : ''].join('|');
      var urlKey = c.url ? 'u:' + String(c.url).trim() : null;
      if (seen[key] !== undefined || (urlKey && seen[urlKey] !== undefined)) {
        r.status = 'rejetée'; r.reason = 'Doublon probable'; return;
      }
      seen[key] = r.index; if (urlKey) seen[urlKey] = r.index;
      r.priceAdj = r.price * (r.seller === 'pro' ? (1 + opts.proAdj) : 1);
    });

    function active() { return rows.filter(function (r) { return r.status === 'ok'; }); }
    if (active().length < opts.minComps) {
      return {
        ok: false, comps: rows, needed: opts.minComps, found: active().length,
        error: 'Au moins ' + opts.minComps + ' annonces valides sont nécessaires pour une estimation fiable (' + active().length + ' actuellement).'
      };
    }

    var prior = { b: opts.priorKm, c: opts.priorYear };
    var model = null, pass;
    for (pass = 0; pass < 3; pass++) {
      var act = active();
      var pts = act.map(function (r) {
        return { y: Math.log(r.priceAdj), x1: r.km / 1e4, x2: r.age, w: r.country === 'FR' ? 1 : opts.foreignWeight };
      });
      model = fitModel(pts, prior, opts.ridgeK);
      act.forEach(function (r) {
        r.logNorm = Math.log(r.priceAdj) + model.b * ((tKm - r.km) / 1e4) + model.c * (tAge - r.age);
        r.norm = Math.exp(r.logNorm);
      });
      if (act.length < 5) break;
      var logs = act.map(function (r) { return r.logNorm; });
      var med = median(logs), sd = Math.max(1.4826 * mad(logs), 0.03);
      var removed = 0;
      act.forEach(function (r) {
        var z = (r.logNorm - med) / sd;
        if (Math.abs(z) > opts.outlierZ && active().length > opts.minComps) {
          r.status = 'aberrante';
          r.reason = (z > 0 ? 'Prix très au-dessus' : 'Prix très en dessous') + ' du marché (écart ' + Math.round((Math.exp(r.logNorm - med) - 1) * 100) + ' %)';
          removed++;
        }
      });
      if (!removed) break;
    }

    var kept = active();
    kept.forEach(function (r) {
      var sim = 1 / (1 + Math.abs(r.km - tKm) / 50000 + Math.abs(r.age - tAge) / 3);
      r.weight = (r.country === 'FR' ? 1 : opts.foreignWeight) * sim;
    });
    var vals = kept.map(function (r) { return r.norm; });
    var wts = kept.map(function (r) { return r.weight; });
    var market = {
      p25: weightedQuantile(vals, wts, 0.25),
      median: weightedQuantile(vals, wts, 0.5),
      p75: weightedQuantile(vals, wts, 0.75),
      min: Math.min.apply(null, vals), max: Math.max.apply(null, vals),
      n: kept.length
    };

    // Confiance (0-100)
    var spread = (market.p75 - market.p25) / market.median;
    var sources = {};
    kept.forEach(function (r) { sources[sourceKey(r.source) || 'inconnue'] = 1; });
    var nSources = Object.keys(sources).length;
    var frShare = sum(kept.map(function (r) { return r.country === 'FR' ? 1 : 0; })) / kept.length;
    var medDist = median(kept.map(function (r) { return Math.abs(r.km - tKm); }));
    var parts = {
      volume: Math.min(40, kept.length * 4),
      dispersion: Math.round(30 * clamp(1 - spread / 0.30, 0, 1)),
      sources: nSources >= 3 ? 15 : (nSources === 2 ? 8 : 0),
      localite: Math.round(10 * frShare),
      proximite: Math.round(5 * clamp(1 - medDist / 80000, 0, 1))
    };
    var score = parts.volume + parts.dispersion + parts.sources + parts.localite + parts.proximite;
    var label = score < 35 ? 'Faible' : score < 55 ? 'Moyenne' : score < 75 ? 'Bonne' : 'Très bonne';

    if (kept.length < 5) warnings.push('Moins de 5 annonces exploitables : la fourchette est peu fiable. Ajoutez-en (idéalement 8 à 15).');
    if (nSources < 2) warnings.push('Une seule source d\'annonces : croisez avec au moins 2 autres sites.');
    if (spread > 0.25) warnings.push('Prix très dispersés (écart interquartile de ' + Math.round(spread * 100) + ' %) : vérifiez que les annonces correspondent à la même version/motorisation.');
    if (frShare < 0.5) warnings.push('Plus de la moitié des annonces sont hors France : le marché français peut différer (fiscalité, malus, TVA).');
    if (medDist > 60000) warnings.push('Les annonces sont en moyenne éloignées de votre kilométrage (±' + Math.round(medDist / 1000) + ' 000 km) : l\'ajustement repose davantage sur le modèle.');
    var nAber = rows.filter(function (r) { return r.status === 'aberrante'; }).length;
    if (nAber) warnings.push(nAber + ' annonce(s) aberrante(s) écartée(s) automatiquement.');
    var nRej = rows.filter(function (r) { return r.status === 'rejetée'; }).length;
    if (nRej) warnings.push(nRej + ' ligne(s) rejetée(s) (données incomplètes ou doublons).');

    return {
      ok: true, comps: rows, market: market,
      model: { kmPer10k: model.b, perYear: model.c, source: model.source,
        kmPct: Math.round((Math.exp(model.b) - 1) * 1000) / 10, yearPct: Math.round((Math.exp(model.c) - 1) * 1000) / 10 },
      target: { age: tAge, km: tKm },
      confidence: { score: score, label: label, parts: parts, spread: spread, sources: nSources },
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* Frais, scénarios, prix d'achat maximum                              */
  /* ------------------------------------------------------------------ */
  // Ordres de grandeur France (garage indépendant, pièces + main-d'œuvre). À remplacer par des devis.
  var REPAIR_LIBRARY = [
    { id: 'vidange', label: 'Vidange + filtres', min: 100, max: 250 },
    { id: 'revision', label: 'Révision complète constructeur', min: 250, max: 650 },
    { id: 'plaq_av', label: 'Plaquettes avant', min: 100, max: 250 },
    { id: 'disq_av', label: 'Disques + plaquettes avant', min: 250, max: 550 },
    { id: 'frein_ar', label: 'Freins arrière (plaquettes / disques)', min: 150, max: 450 },
    { id: 'pneus', label: 'Pneus (jeu de 4)', min: 300, max: 900 },
    { id: 'distrib', label: 'Distribution + pompe à eau', min: 450, max: 1200 },
    { id: 'embrayage', label: 'Embrayage (kit complet)', min: 700, max: 1700 },
    { id: 'batterie', label: 'Batterie 12 V', min: 90, max: 250 },
    { id: 'amort', label: 'Amortisseurs (paire)', min: 250, max: 700 },
    { id: 'geom', label: 'Géométrie / parallélisme', min: 50, max: 100 },
    { id: 'clim', label: 'Climatisation (recharge → compresseur)', min: 90, max: 1000 },
    { id: 'turbo', label: 'Turbo', min: 900, max: 2500 },
    { id: 'fap_egr', label: 'FAP / vanne EGR', min: 400, max: 1600 },
    { id: 'injecteurs', label: 'Injecteurs (diesel)', min: 600, max: 2000 },
    { id: 'boite', label: 'Boîte auto : vidange → réparation', min: 200, max: 1500 },
    { id: 'diag', label: 'Diagnostic électronique', min: 50, max: 120 },
    { id: 'ct', label: 'Contrôle technique (+ contre-visite)', min: 80, max: 160 },
    { id: 'carro', label: 'Carrosserie (par élément)', min: 200, max: 800 },
    { id: 'parebrise', label: 'Pare-brise', min: 250, max: 900 },
    { id: 'prepa', label: 'Préparation esthétique complète', min: 80, max: 250 },
    { id: 'batHV', label: 'Test de santé de la batterie de traction (électrique/hybride)', min: 50, max: 150 }
  ];

  /* Catégories : les prix de pièces et de main-d'œuvre varient fortement selon le véhicule. */
  var REPAIR_CATEGORIES = {
    citadine: { label: 'Citadine (Clio, 208, C3, Polo, 500…)', mult: 0.85 },
    compacte: { label: 'Compacte / familiale (308, Golf, Mégane…)', mult: 1.0 },
    berline: { label: 'Berline / break généraliste (508, Passat…)', mult: 1.1 },
    suv: { label: 'SUV / crossover (3008, Qashqai, Tiguan…)', mult: 1.15 },
    utilitaire: { label: 'Utilitaire (Kangoo, Trafic, Transit…)', mult: 1.1 },
    premium: { label: 'Premium (BMW, Mercedes, Audi, Volvo, Tesla…)', mult: 1.5 }
  };
  var PREMIUM_MAKES = /^(bmw|mercedes|mercedes-benz|audi|porsche|volvo|land rover|range rover|jaguar|lexus|tesla|alfa romeo|maserati|ds|ds automobiles|mini|infiniti|genesis)$/;
  var UTIL_MODELS = /\b(kangoo|berlingo|partner|transit|trafic|vivaro|combo|master|jumpy|expert|doblo|caddy|sprinter|boxer|ducato|proace|jumper|dispatch|crafter|movano|nv200|connect|rifter|express|townstar)\b/;
  var SUV_MODELS = /\b(suv|x1|x2|x3|x5|q2|q3|q5|q7|captur|kadjar|3008|5008|2008|3008|c3 aircross|c4 cactus|c5 aircross|tucson|kona|kuga|duster|stepway|qashqai|juke|x-trail|tiguan|t-roc|t-cross|tiguan|yaris cross|c-hr|rav4|sportage|puma|arkana|austral|koleos|ateca|karoq|kodiaq|arona|formentor|countryman|crossland|grandland|mokka|ecosport|sorento|santa fe|cx-3|cx-5|cx-30|ev6|niro|bronco|defender|evoque|discovery|compass|renegade|avenger|bayon|sandero stepway|spring|id\.4|id\.5|model y|model x|ix3)\b/;
  var CITY_MODELS = /\b(clio|208|207|c3|polo|corsa|fiesta|yaris|500|panda|twingo|sandero|i10|i20|picanto|rio|micra|up|107|108|aygo|ka|swift|ibiza|fabia|zoe|c1|citigo|mii|saxo|106|206|ypsilon|jazz|adam|mini one|e-up|spark|joy|sandero)\b/;
  var SEDAN_MODELS = /\b(508|407|406|talisman|laguna|passat|insignia|c5|c6|superb|mondeo|avensis|accord|a4|a6|classe c|classe e|serie 3|serie 5|model 3|model s|v60|v90|s60|s90|octavia|vel satis|safrane|405|605|607|xantia|xsara picasso)\b/;

  function guessCategory(make, model) {
    var mk = stripAccents(String(make || '').toLowerCase()).trim();
    var md = stripAccents(String(model || '').toLowerCase()).trim();
    if (PREMIUM_MAKES.test(mk)) return 'premium';
    if (UTIL_MODELS.test(md)) return 'utilitaire';
    if (SUV_MODELS.test(md)) return 'suv';
    if (CITY_MODELS.test(md)) return 'citadine';
    if (SEDAN_MODELS.test(md)) return 'berline';
    return 'compacte';
  }

  function normEnergy(e) {
    var t = stripAccents(String(e || '').toLowerCase());
    if (/electri/.test(t)) return 'electric';
    if (/rechargeable|phev/.test(t)) return 'phev';
    if (/hybrid/.test(t)) return 'hybrid';
    if (/diesel|gazole/.test(t)) return 'diesel';
    if (/essence|petrol|gasoline/.test(t)) return 'petrol';
    return '';
  }

  /**
   * Réparations et contrôles à prévoir d'après l'âge, le kilométrage, l'énergie et la boîte.
   * Ce sont des probabilités de bon sens (intervalles d'entretien usuels), pas un diagnostic :
   * le carnet d'entretien et un essai remplacent toujours ces suggestions.
   */
  function suggestRepairs(v, today) {
    v = v || {};
    var age = ageYears(v.year, v.month, today), km = toNumber(v.km);
    if (!isFinite(age) || !isFinite(km)) return [];
    var en = normEnergy(v.energy), ev = en === 'electric', diesel = en === 'diesel';
    var thermal = !ev;
    var manual = /manuel/i.test(String(v.gearbox || '')), autoBox = /auto/i.test(String(v.gearbox || ''));
    var out = [];
    function add(id, level, why) { out.push({ id: id, level: level, why: why }); }

    add('diag', 'possible', 'Lecture des codes défaut et des calculateurs avant tout achat.');
    if (age >= 4) add('ct', 'probable', 'Contrôle technique de moins de 6 mois obligatoire pour vendre un véhicule de plus de 4 ans.');
    if (thermal) {
      if (age >= 1.5 || km >= 15000) add('vidange', 'probable', 'Entretien courant : huile et filtres tous les 15 000 à 20 000 km ou 1 an.');
      if (km >= 60000 || age >= 6) add('revision', 'probable', 'Révision complète à ce stade : points de contrôle, liquides, filtres.');
    } else {
      add('batHV', 'probable', 'La batterie de traction fait l\'essentiel de la valeur : demandez un test de santé (SoH).');
      if (age >= 4) add('batterie', 'possible', 'Batterie 12 V : durée de vie de 4 à 6 ans.');
    }
    if (km >= 100000) add('disq_av', 'probable', 'Disques et plaquettes avant : usure normale vers 100 000 km.');
    else if (km >= 60000) add('plaq_av', 'probable', 'Plaquettes avant : usure normale entre 40 000 et 80 000 km.');
    else if (km >= 40000) add('plaq_av', 'possible', 'Plaquettes avant : à vérifier, usure possible dès 40 000 km.');
    if (km >= 90000) add('frein_ar', 'possible', 'Freins arrière : à vérifier avec le kilométrage.');
    if (age >= 5 || km >= 60000) add('pneus', 'probable', 'Pneus : âge ou kilométrage justifient un jeu neuf ou un contrôle (voir date DOT).');
    else if (km >= 40000) add('pneus', 'possible', 'Pneus : vérifier usure et âge.');
    if (km >= 30000) add('geom', 'possible', 'Géométrie à contrôler si les pneus s\'usent de façon inégale.');
    if (thermal && age >= 5) add('batterie', 'probable', 'Batterie 12 V : durée de vie de 4 à 6 ans.');
    else if (thermal && age >= 3) add('batterie', 'possible', 'Batterie 12 V : à tester.');
    if (km >= 100000) add('amort', 'probable', 'Amortisseurs : usure habituelle vers 100 000 km.');
    else if (km >= 70000) add('amort', 'possible', 'Amortisseurs : à contrôler.');
    if (age >= 10) add('clim', 'possible', 'Climatisation : recharge ou compresseur fréquents après 10 ans.');
    else if (age >= 6) add('clim', 'possible', 'Climatisation : tester le froid et la pression.');
    if (thermal) {
      if (km >= 110000 || age >= 9) add('distrib', 'probable', 'Distribution : à faire vers 100 000 à 150 000 km ou 8 à 10 ans. Demandez la facture : si elle manque, comptez-la.');
      else if (km >= 80000 || age >= 6) add('distrib', 'possible', 'Distribution : vérifier si elle a déjà été faite (facture) ou si une chaîne est montée.');
      if (manual) {
        if (km >= 130000) add('embrayage', 'probable', 'Embrayage : usure fréquente au-delà de 130 000 km.');
        else if (km >= 90000) add('embrayage', 'possible', 'Embrayage : tester patinage et point dur.');
      }
      if (autoBox) {
        if (km >= 140000) add('boite', 'probable', 'Boîte automatique : vidange ou réparation à prévoir à ce kilométrage.');
        else if (km >= 80000) add('boite', 'possible', 'Boîte automatique : vérifier l\'historique de vidange.');
      }
      if (diesel) {
        if (km >= 120000 || age >= 9) add('fap_egr', 'probable', 'FAP et vanne EGR : encrassement fréquent sur diesel, surtout en usage urbain.');
        else if (km >= 80000) add('fap_egr', 'possible', 'FAP et vanne EGR : à vérifier (voyants, régénérations).');
        if (km >= 180000) add('injecteurs', 'probable', 'Injecteurs diesel : défaillances plus fréquentes après 180 000 km.');
        else if (km >= 140000) add('injecteurs', 'possible', 'Injecteurs diesel : surveiller fumées et à-coups.');
      }
      if ((diesel || en === 'petrol') && km >= 150000) add('turbo', 'possible', 'Turbo : usure possible après 150 000 km (fumée, perte de puissance).');
    }
    var rank = { probable: 0, possible: 1 };
    out.sort(function (a, b) { return rank[a.level] - rank[b.level]; });
    return out;
  }

  function defaultCosts() {
    return {
      repairs: REPAIR_LIBRARY.map(function (r) { return { id: r.id, label: r.label, min: r.min, max: r.max, qty: 1, include: false, override: null }; }),
      customRepairs: [],            // [{label, amount}]
      transport: 0, registration: 0, otherBuy: 0,
      adFees: 0, otherSell: 0, platformPct: 0,
      holdPerDay: 2,                // assurance + stationnement, €/jour
      capitalRate: 0.05,            // coût annuel de l'argent immobilisé
      profitMode: 'fixed', profitValue: 500
    };
  }

  function sumRepairs(costs) {
    var low = 0, mid = 0, high = 0, lines = [];
    var mult = toNumber(costs.repairMult); if (!isFinite(mult) || mult <= 0 || mult > 5) mult = 1;
    (costs.repairs || []).forEach(function (it) {
      if (!it.include) return;
      var q = Math.max(0, toNumber(it.qty)); if (!isFinite(q)) q = 1;
      var ov = toNumber(it.override), lo, hi;
      if (isFinite(ov) && ov >= 0) { lo = hi = ov; } else { lo = (toNumber(it.min) || 0) * mult; hi = (toNumber(it.max) || 0) * mult; if (hi < lo) hi = lo; }
      low += lo * q; high += hi * q; mid += ((lo + hi) / 2) * q;
      lines.push({ label: it.label, low: lo * q, mid: ((lo + hi) / 2) * q, high: hi * q, quoted: isFinite(ov) });
    });
    (costs.customRepairs || []).forEach(function (it) {
      var a = toNumber(it.amount);
      if (!isFinite(a) || a < 0) return;
      low += a; mid += a; high += a;
      lines.push({ label: it.label || 'Autre', low: a, mid: a, high: a, quoted: true });
    });
    return { low: low, mid: mid, high: high, lines: lines };
  }

  var SCENARIOS = {
    prudent:   { label: 'Prudent',   q: 'p25',    neg: 0.06, days: 70, rep: 'high', cont: 0.10 },
    realiste:  { label: 'Réaliste',  q: 'median', neg: 0.06, days: 45, rep: 'mid',  cont: 0.05 },
    optimiste: { label: 'Optimiste', q: 'p75',    neg: 0.05, days: 30, rep: 'low',  cont: 0.02 }
  };

  function num0(v, d) { var n = toNumber(v); return isFinite(n) ? n : (d || 0); }

  function computeScenario(key, market, model, costs, condFactor) {
    var sc = SCENARIOS[key];
    var rep = sumRepairs(costs);
    var ask = market[sc.q] * (1 + condFactor);
    var months = sc.days / 30.4;
    var drift = 1 - Math.exp(model.perYear / 12);               // dépréciation mensuelle due à l'âge
    var sold = ask * (1 - sc.neg) * (1 - drift * months);
    var platform = sold * num0(costs.platformPct) / 100;
    var netSold = sold - platform - num0(costs.adFees) - num0(costs.otherSell);
    var acquisition = num0(costs.transport) + num0(costs.registration) + num0(costs.otherBuy);
    var holding = num0(costs.holdPerDay) * sc.days;
    var repairs = rep[sc.rep];
    var r = num0(costs.capitalRate) * sc.days / 365;
    var profitFixed = costs.profitMode === 'pct' ? 0 : num0(costs.profitValue);
    var profitPct = costs.profitMode === 'pct' ? num0(costs.profitValue) / 100 : 0;
    var fixed = repairs + acquisition + holding + profitFixed;
    var maxP = (netSold - fixed) / (1 + r + sc.cont + profitPct);
    var viable = maxP > 0;
    if (!viable) maxP = 0;
    return {
      key: key, label: sc.label, ask: ask, sold: sold, netSold: netSold, days: sc.days,
      repairs: repairs, acquisition: acquisition, holding: holding,
      capitalRate: r, contingencyPct: sc.cont, profitFixed: profitFixed, profitPct: profitPct,
      sellingCosts: platform + num0(costs.adFees) + num0(costs.otherSell),
      maxPurchase: maxP, viable: viable,
      breakdown: function (P) {
        var profit = profitFixed + profitPct * P;
        return {
          netSold: netSold, repairs: repairs, acquisition: acquisition, holding: holding,
          capital: P * r, contingency: P * sc.cont, profit: profit,
          result: netSold - repairs - acquisition - holding - P * r - P * sc.cont - P
        };
      }
    };
  }

  /** Bénéfice attendu si on achète à un prix donné, dans un scénario. */
  function profitAtPrice(scn, P) {
    return scn.netSold - scn.repairs - scn.acquisition - scn.holding - P * (1 + scn.capitalRate + scn.contingencyPct);
  }

  function roundPrice(x) { return isFinite(x) ? Math.max(0, roundTo(x, 10)) : NaN; }

  /** Point d'entrée principal. Ne lève jamais d'exception. */
  function valuate(input) {
    var inp = input || {};
    var opts = Object.assign({}, DEFAULT_MARKET, inp.market || {});
    var an = analyzeComparables(inp.target || {}, inp.comps || [], opts);
    if (!an.ok) return an;
    var costs = Object.assign(defaultCosts(), inp.costs || {});
    var cond = (opts.conditionFactor || {})[inp.condition || 'bon'];
    if (!isFinite(cond)) cond = 0;

    var scenarios = {};
    Object.keys(SCENARIOS).forEach(function (k) { scenarios[k] = computeScenario(k, an.market, an.model, costs, cond); });

    var mk = an.market;
    var listing = Math.ceil(mk.median * (1 + cond) / 50) * 50;
    var expectedSoldRaw = scenarios.realiste.sold;
    var sale = {
      listing: listing,
      expectedSold: roundPrice(expectedSoldRaw),
      // vente rapide : annonce sous le marché, jamais au-dessus de la médiane − 4 %
      quickAsk: roundPrice(Math.min(mk.p25 * (1 + cond), mk.median * (1 + cond) * 0.96)),
      // plancher : on ne descend pas sous ce prix, et toujours sous le prix de vente attendu
      quickFloor: roundPrice(Math.min(mk.p25 * (1 + cond) * 0.97, expectedSoldRaw * 0.97)),
      highAsk: roundPrice(mk.p75 * (1 + cond))
    };

    var out = {

  function niceStep(raw) { var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

    var d = new Date();
    saved.unshift({ id: uid(), name: name, savedAt: d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }), state: sanitize(snap) });
    if (saved.length > 200) saved.length = 200;
    saveSaved(); toast('Dossier enregistré'); if (tab === 'dossiers') renderTab(true);
  }

  /* ---------- Exports ---------- */
  function exportItems() {
    var items = [];
    if (hasData(state)) items.push({ name: displayName(state) + ' (en cours)', st: state, savedAt: '' });
    saved.forEach(function (d) { items.push({ name: d.name, st: d.state, savedAt: d.savedAt }); });
    return items;
  }
  function dossierRows() {
    return exportItems().map(function (it) {
      var v = it.st.v, r = E.valuate(buildInput(it.st)), ok = r && r.ok;
      return { name: it.name, plate: v.plate, vin: v.vin, make: v.make, model: v.model, trim: v.trim, energy: v.energy, gearbox: v.gearbox, cat: effCategory(it.st), month: toNum(v.month), year: toNum(v.year), km: toNum(v.km), cv: toNum(v.cv), cond: v.condition, asking: toNum(v.asking),
        kept: ok ? r.market.n : '', total: it.st.comps.length, med: ok ? Math.round(r.market.median) : '', p25: ok ? Math.round(r.market.p25) : '', p75: ok ? Math.round(r.market.p75) : '', listing: ok ? r.sale.listing : '', sold: ok ? r.sale.expectedSold : '',
        opening: ok ? r.headline.opening : '', max: ok ? r.headline.max : '', stretch: ok ? r.headline.stretch : '', rep: ok ? Math.round(r.scenarios.realiste.repairs) : '', profit: it.st.costs.profitMode === 'pct' ? (toNum(it.st.costs.profitValue) || 0) + ' %' : (toNum(it.st.costs.profitValue) || 0),
        conf: ok ? r.confidence.label : '', score: ok ? r.confidence.score : '', date: it.savedAt };
    });
  }
  var DCOLS = [['Dossier', 'name'], ['Plaque', 'plate'], ['VIN', 'vin'], ['Marque', 'make'], ['Modèle', 'model'], ['Version', 'trim'], ['Énergie', 'energy'], ['Boîte', 'gearbox'], ['Catégorie', 'cat'], ['Mois', 'month'], ['Année', 'year'], ['Km', 'km'], ['CV fiscaux', 'cv'], ['État à la revente', 'cond'], ['Prix demandé (€)', 'asking'], ['Annonces retenues', 'kept'], ['Annonces saisies', 'total'], ['Marché médian (€)', 'med'], ['Marché 25 % (€)', 'p25'], ['Marché 75 % (€)', 'p75'], ['Annonce conseillée (€)', 'listing'], ['Vente attendue (€)', 'sold'], ['Offre ouverture (€)', 'opening'], ['Prix achat max (€)', 'max'], ['Limite absolue (€)', 'stretch'], ['Réparations, scénario réaliste (€)', 'rep'], ['Bénéfice visé', 'profit'], ['Confiance', 'conf'], ['Score confiance', 'score'], ['Enregistré le', 'date']].map(function (c) { return { label: c[0], key: c[1] }; });
  function annonceRows() {
    var rows = [];
    exportItems().forEach(function (it) {
      var r = E.valuate(buildInput(it.st)), cr = r && r.comps ? r.comps : [];
      it.st.comps.forEach(function (c, i) {
        var x = cr[i] || {};
        rows.push({ dossier: it.name, price: toNum(c.price), km: toNum(c.km), year: toNum(c.year), month: toNum(c.month), source: c.source, country: c.country, seller: c.seller === 'pro' ? 'Pro' : c.seller === 'part' ? 'Particulier' : '', url: c.url, used: c.include !== false, status: x.status === 'ok' ? 'Retenue' : (x.status || ''), reason: x.reason || '', norm: isFinite(x.norm) ? Math.round(x.norm) : '' });
      });
    });
    return rows;
  }
  var ACOLS = [['Dossier', 'dossier'], ['Prix (€)', 'price'], ['Km', 'km'], ['Année', 'year'], ['Mois', 'month'], ['Source', 'source'], ['Pays', 'country'], ['Vendeur', 'seller'], ['Lien', 'url'], ['Utilisée', 'used'], ['Statut', 'status'], ['Raison', 'reason'], ['Prix ramené au véhicule (€)', 'norm']].map(function (c) { return { label: c[0], key: c[1] }; });

  function tsv(rows, cols) {
    function cell(v) { if (v == null || (typeof v === 'number' && !isFinite(v))) return ''; return String(v).replace(/[\t\r\n]+/g, ' '); }
    return [cols.map(function (c) { return c.label; }).join('\t')].concat(rows.map(function (r) { return cols.map(function (c) { return cell(r[c.key]); }).join('\t'); })).join('\n');
  }
  function expMsg(html) { var el = $('#expMsg'); if (el) el.innerHTML = html; }

  function exportFile(filename, text) {
    function viaBlob() {
      try {
        var mime = /\.json$/.test(filename) ? 'application/json' : 'text/csv;charset=utf-8';
        var url = URL.createObjectURL(new Blob([text], { type: mime }));
        var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
        toast('Fichier « ' + filename + ' » généré');
      } catch (e) { expMsg('<div class="note warn">Téléchargement impossible ici. Utilisez « Copier » et collez dans votre tableur.</div>'); }
    }
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        window.claude.use('downloads').then(function (dl) {
          if (!dl) return viaBlob();
          return dl.save({ filename: filename, data: text }).then(function () { toast('Fichier « ' + filename + ' » enregistré'); }, function (err) {
            if (err && err.code === 'declined') return;
            expMsg('<div class="note warn">Enregistrement refusé ou indisponible dans cet affichage. Utilisez « Copier » et collez dans votre tableur.</div>');
          });
        }, viaBlob);
        return;
      }
    } catch (e) { /* repli ci-dessous */ }
    viaBlob();
  }
  function copyText(text, label) {
    function fallback() {
      try { var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove(); toast(ok ? label + ' copié' : 'Copie impossible'); } catch (e) { toast('Copie impossible'); }
    }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(label + ' copié'); }, fallback); else fallback(); } catch (e) { fallback(); }
  }
  function backupJson() { return JSON.stringify({ format: 'estimauto', version: 1, exportedAt: new Date().toISOString(), current: persistable(state), saved: saved.map(function (d) { return { id: d.id, name: d.name, savedAt: d.savedAt, state: persistable(d.state) }; }) }, null, 1); }
  function importJsonFile(file) {
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) { expMsg('<div class="note bad">Fichier trop volumineux.</div>'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var j = JSON.parse(String(fr.result));
        if (!j || j.format !== 'estimauto') throw new Error('format');
        var n = 0;
        (Array.isArray(j.saved) ? j.saved : []).slice(0, 200).forEach(function (d) {
          if (!d || typeof d !== 'object') return;
          saved.push({ id: uid(), name: str(d.name, 120) || 'Importé', savedAt: str(d.savedAt, 40), state: sanitize(d.state) }); n++;
        });
        if (j.current && hasData(sanitize(j.current))) { saved.push({ id: uid(), name: displayName(sanitize(j.current)) + ' (importé)', savedAt: '', state: sanitize(j.current) }); n++; }
        saved = saved.slice(0, 200); saveSaved(); renderTab(true);
        expMsg('<div class="note good">' + n + ' dossier(s) importé(s).</div>');
      } catch (e) { expMsg('<div class="note bad">Ce fichier n\'est pas une sauvegarde Estimateur Auto valide.</div>'); }
    };
    fr.onerror = function () { expMsg('<div class="note bad">Lecture du fichier impossible.</div>'); };
    fr.readAsText(file);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act'), i = Number(btn.getAttribute('data-i'));
    if (needsConfirm(btn)) return;
    try {
      switch (act) {
        case 'goto': goto(btn.getAttribute('data-tab')); break;
        case 'analyze': updateDetect(); save(); live(); if (state.v.vin) decodeOnline(); else if (auto.server && auto.plateApi && state.v.plate) lookupPlate(); break;
        case 'plate-lookup': lookupPlate(); break;
        case 'use-year': state.v.year = btn.getAttribute('data-year'); save(); renderTab(true); live(); toast('Année ' + state.v.year + ' appliquée'); break;
        case 'decode': decodeOnline(); break;
        case 'auto-search': autoSearch(); break;
        case 'toggle-src': var sid = btn.getAttribute('data-src'), sx = auto.sources.indexOf(sid); if (sx >= 0) auto.sources.splice(sx, 1); else auto.sources.push(sid); apPersist(); renderTab(true); break;
        case 'src-all': auto.sources = SRC_ALL.slice(); apPersist(); renderTab(true); break;
        case 'src-sure': auto.sources = SRC_SURE.slice(); apPersist(); renderTab(true); break;
        case 'src-none': auto.sources = []; apPersist(); renderTab(true); break;
        case 'src-reset': auto.health = {}; apPersist(); renderTab(true); break;
        case 'save-relay': saveRelay(); renderTab(true); break;
        case 'test-relay': testRelay(); break;
        case 'set-mode': state.mode = btn.getAttribute('data-mode') === 'buy' ? 'buy' : btn.getAttribute('data-mode') === 'sell' ? 'sell' : 'both'; save(); recompute(); renderSummary(); renderTab(true); break;
        case 'copy-summary': copyText(summaryText(), 'Résumé'); break;
        case 'share-summary': try { navigator.share({ title: 'Estimation ' + displayName(state), text: summaryText() }).catch(function () {}); } catch (e) { copyText(summaryText(), 'Résumé'); } break;
        case 'apply-suggest': E.suggestRepairs({ year: state.v.year, month: state.v.month, km: state.v.km, energy: state.v.energy, gearbox: state.v.gearbox }).forEach(function (x) { if (x.level !== 'probable') return; var it = state.costs.repairs.filter(function (r) { return r.id === x.id; })[0]; if (it) it.include = true; }); save(); recompute(); renderSummary(); renderTab(true); toast('Réparations probables cochées'); break;
        case 'add-comp': addCompFromDraft(); break;
        case 'import-comps': importFromText(); break;
        case 'comp-del': state.comps.splice(i, 1); save(); recompute(); renderSummary(); renderTab(true); break;
        case 'comp-edit': var c = state.comps[i]; if (c) { state.draft = { price: c.price, km: c.km, year: c.year, month: c.month, source: c.source, country: c.country, seller: c.seller, url: c.url, note: c.note }; state.comps.splice(i, 1); save(); recompute(); renderSummary(); renderTab(false); var el = $('#f-draft-price'); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } } break;
        case 'clear-comps': state.comps = []; save(); importMsg = ''; recompute(); renderSummary(); renderTab(true); break;
        case 'add-custom':
          var lab = $('#cr-label').value.trim(), amt = toNum($('#cr-amount').value);
          if (isFinite(amt) && amt >= 0) { state.costs.customRepairs.push({ label: lab.slice(0, 60), amount: String(amt) }); save(); recompute(); renderSummary(); renderTab(true); } else toast('Saisissez un montant valide');
          break;
        case 'del-custom': state.costs.customRepairs.splice(i, 1); save(); recompute(); renderSummary(); renderTab(true); break;
        case 'save-dossier': saveDossier(); break;
        case 'new-dossier': case 'new-dossier-now': state = blankState(); importMsg = ''; save(); renderAll(false); goto('vehicule'); toast('Nouveau dossier'); break;
        case 'hide-example': state.example = false; save(); renderTab(true); break;
        case 'open-dossier': var d = saved[i]; if (d) { state = sanitize(JSON.parse(JSON.stringify(persistable(d.state)))); importMsg = ''; save(); recompute(); renderSummary(); renderPlate(); goto('resultat'); toast('Dossier ouvert'); } break;
        case 'del-dossier': saved.splice(i, 1); saveSaved(); renderTab(true); break;
        case 'export-dossiers': exportFile('estimateur-auto-dossiers.csv', E.toCSV(dossierRows(), DCOLS)); break;
        case 'export-annonces': exportFile('estimateur-auto-annonces.csv', E.toCSV(annonceRows(), ACOLS)); break;
        case 'export-json': exportFile('estimateur-auto-sauvegarde.json', backupJson()); break;
        case 'copy-dossiers': copyText(tsv(dossierRows(), DCOLS), 'Synthèse'); break;
        case 'copy-annonces': copyText(tsv(annonceRows(), ACOLS), 'Annonces'); break;
      }
    } catch (err) { console.error(err); showError(err); }
  });

  /* ---------- Robustesse ---------- */
  var errShown = false;
  function showError(err) {
    if (errShown) return; errShown = true;
    var el = $('#errbar'); if (!el) return;
    el.hidden = false;
    el.innerHTML = '<div class="note bad" style="margin-bottom:14px"><b>Une erreur est survenue.</b> Vos données sont conservées sur cet appareil. Si l\'écran ne répond plus, rechargez la page. <button type="button" class="linkbtn" id="errclose">Fermer</button></div>';
    var c = $('#errclose'); if (c) c.addEventListener('click', function () { el.hidden = true; errShown = false; });
  }
  window.addEventListener('error', function (e) { console.error(e.error || e.message); showError(e.error); });
  window.addEventListener('unhandledrejection', function (e) { console.error(e.reason); });
  window.addEventListener('hashchange', function () { var t = location.hash.replace('#', ''); if (VIEWS[t] && t !== tab) goto(t); });
  window.addEventListener('pagehide', function () { clearTimeout(saveT); lsSet(KEY, JSON.stringify(persistable(state))); });

  /* ---------- Démarrage ---------- */
  loadAll();
  var h0 = (location.hash || '').replace('#', '');
  if (VIEWS[h0]) tab = h0;
  renderAll(false);
  updateDetect();
})();
</script>
